{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-fluid py-5 px-lg-5" style="background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); min-height: 100vh;">
    
    <div class="row justify-content-center mb-4">
        <div class="col-lg-8 col-xl-6 px-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a href="{% url 'my_account' %}" class="text-decoration-none text-muted small">My Account</a></li>
                    <li class="breadcrumb-item active small" aria-current="page">Run for Office</li>
                </ol>
            </nav>
            <h2 class="fw-bold text-dark">Nomination <span class="text-primary">Form</span></h2>
            <p class="text-muted small">Submit your application to run for an office position. You can only apply for one position.</p>
        </div>
    </div>

    <div class="row justify-content-center g-4">
        <div class="col-lg-8 col-xl-6">
            
            <div class="card border-0 shadow-sm mb-4" style="border-radius: 24px; background: #ffffff;">
                <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                    <h5 class="fw-bold mb-0">
                        <i class="bi bi-person-up me-2 text-primary"></i>Application Details
                    </h5>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="post" action="{% url 'apply_for_office' %}" class="row g-3">
                        {% csrf_token %}
                        <div class="col-12 modern-crispy">
                            {{ form|crispy }}
                        </div>
                        <div class="col-12 mt-4 text-end">
                            <a href="{% url 'my_account' %}" class="btn btn-light px-4 py-2 rounded-pill fw-bold text-muted me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill shadow-md fw-bold">
                                Submit Nomination
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    .btn-primary { background: #4f46e5; border: none; }
    .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
    
    .modern-crispy label { font-weight: 700; font-size: 0.85rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
    .modern-crispy select, .modern-crispy textarea { 
        border-radius: 12px; border: 1px solid #e2e8f0; padding: 12px; background-color: #f8fafc; width: 100%;
    }
    .modern-crispy select:focus, .modern-crispy textarea:focus { 
        background-color: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); border-color: #4f46e5; outline: none;
    }
    
    .shadow-md { box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
</style>
{% endblock %}
