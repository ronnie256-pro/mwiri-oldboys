<!-- ADMIN LOGIN MODAL -->
<style>
    .modal-backdrop.show {
        backdrop-filter: blur(6px) !important;
        -webkit-backdrop-filter: blur(6px) !important;
        background-color: rgba(0, 22, 48, 0.45) !important;
    }
</style>

<div class="modal fade" id="adminLoginModal" tabindex="-1" aria-labelledby="adminLoginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden bg-white text-dark">
            
            <!-- MODAL HEADER -->
            <div class="modal-header border-bottom p-4 bg-light">
                <h5 class="modal-title fw-bold m-0" id="adminLoginModalLabel" style="color: #002147;">Admin</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- MODAL BODY -->
            <div class="modal-body p-4">
                <form method="post" action="{% url 'admin_dashboard_login' %}" id="admin-2fa-form">
                    {% csrf_token %}
                    
                    <!-- USERNAME FIELD -->
                    <div class="mb-3">
                        <label for="admin_username" class="form-label small fw-bold text-uppercase text-secondary font-size-xs">Username</label>
                        <input type="text" name="username" id="admin_username" class="form-control bg-light border-1 fw-bold text-dark p-2" required>
                    </div>

                    <!-- PASSWORD FIELD -->
                    <div class="mb-3">
                        <label for="admin_password" class="form-label small fw-bold text-uppercase text-secondary font-size-xs">Password</label>
                        <input type="password" name="password" id="admin_password" class="form-control bg-light border-1 fw-bold text-dark p-2" required>
                    </div>

                    <!-- CODE FIELD -->
                    <div class="mb-4">
                        <label for="admin_code" class="form-label small fw-bold text-uppercase text-secondary font-size-xs">Code</label>
                        <input type="text" name="code" id="admin_code" class="form-control bg-light border-1 fw-bold text-dark text-center tracking-widest p-2" maxlength="6" pattern="[0-9]{6}" required style="letter-spacing: 4px;">
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button type="submit" class="btn w-100 py-2.5 fw-bold rounded-pill shadow-sm" style="background-color: #002147; color: #ffffff; border: none;">
                        Login
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
